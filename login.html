<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POKÉBENA — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070f; --surface: #0e0e1c; --surface-2: #15152a;
      --text: #e2e2f0; --muted: #5a5a7a; --border: rgba(255,255,255,0.06);
      --p1: #F85888; --p2: #6890F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(248,208,48,.1) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(248,88,136,.09) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(112,56,248,.07) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ─────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(7,7,15,.88); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 860px; margin: 0 auto; padding: .9rem 2rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .back-link {
      display: flex; align-items: center; gap: .4rem;
      color: var(--muted); text-decoration: none;
      font-family: 'Orbitron', monospace; font-size: .6rem;
      letter-spacing: .15em; text-transform: uppercase; transition: color .2s;
    }
    .back-link:hover { color: var(--text); }
    .logo {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: clamp(.85rem, 2vw, 1.2rem); letter-spacing: .1em;
      background: linear-gradient(130deg, #F8D030, #F85888);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── MAIN ───────────────────────────────────── */
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem; position: relative; z-index: 1;
    }

    /* ── AUTH CARD ──────────────────────────────── */
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 28px; padding: 2.5rem 2.5rem 2rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,.55);
    }

    /* Pokéball decorativa */
    .pb-deco {
      width: 58px; height: 58px; border-radius: 50%;
      border: 4.5px solid #111; position: relative;
      overflow: hidden; margin: 0 auto 1.5rem;
      box-shadow: 0 0 26px rgba(227,53,13,.45);
    }
    .pb-deco-top  { position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(140deg,#ff5533,#E3350D); }
    .pb-deco-bot  { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(140deg,#fff,#e0e0e0); }
    .pb-deco-band { position: absolute; top: 50%; left: 0; right: 0; height: 7px; background: #111; transform: translateY(-50%); z-index: 2; }
    .pb-deco-btn  { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 38% 35%,#fff,#c0c0c0); border: 3.5px solid #111; z-index: 3; }

    .auth-title {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: 1.05rem; letter-spacing: .1em; text-align: center;
      background: linear-gradient(130deg, #F8D030, #F85888);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: .3rem;
    }
    .auth-sub {
      text-align: center; color: var(--muted); font-size: .82rem;
      font-weight: 500; letter-spacing: .03em; margin-bottom: 2rem;
    }

    /* ── TABS ───────────────────────────────────── */
    .tabs {
      display: flex; gap: .38rem; background: var(--surface-2);
      border-radius: 50px; padding: .28rem; margin-bottom: 1.75rem;
    }
    .tab-btn {
      flex: 1; background: transparent; border: none; color: var(--muted);
      font-family: 'Orbitron', monospace; font-size: .5rem;
      letter-spacing: .14em; text-transform: uppercase;
      padding: .55rem .5rem; border-radius: 50px; cursor: pointer; transition: all .2s;
    }
    .tab-btn.active {
      background: linear-gradient(130deg, rgba(248,208,48,.2), rgba(248,88,136,.15));
      color: #F8D030; box-shadow: 0 0 12px rgba(248,208,48,.12);
    }

    /* ── FORM ───────────────────────────────────── */
    .auth-form { display: flex; flex-direction: column; gap: .82rem; }
    .auth-form.hidden { display: none; }

    .field-group { display: flex; flex-direction: column; gap: .28rem; }
    .field-label {
      font-family: 'Orbitron', monospace; font-size: .44rem;
      letter-spacing: .16em; color: var(--muted); text-transform: uppercase;
    }
    .field-input {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: .72rem 1rem; color: var(--text);
      font-family: 'Rajdhani', sans-serif; font-size: .95rem; font-weight: 600;
      letter-spacing: .04em; outline: none; transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    .field-input::placeholder { color: var(--muted); }
    .field-input:focus { border-color: rgba(248,208,48,.45); box-shadow: 0 0 0 3px rgba(248,208,48,.07); }

    .submit-btn {
      background: linear-gradient(130deg, rgba(248,208,48,.22), rgba(248,88,136,.18));
      border: 1px solid rgba(248,208,48,.45); color: #F8D030;
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: .65rem;
      letter-spacing: .2em; text-transform: uppercase; padding: .95rem;
      border-radius: 50px; cursor: pointer; transition: all .2s; margin-top: .3rem;
      width: 100%;
    }
    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(130deg, rgba(248,208,48,.38), rgba(248,88,136,.3));
      border-color: rgba(248,208,48,.8); box-shadow: 0 0 24px rgba(248,208,48,.25);
    }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    .msg {
      font-size: .82rem; font-weight: 600; text-align: center;
      min-height: 1.1em; letter-spacing: .03em;
    }
    .msg.error   { color: #f87171; }
    .msg.success { color: #4ade80; }

    @media (max-width: 480px) {
      .auth-card { padding: 2rem 1.5rem 1.75rem; border-radius: 22px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="back-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Pokédex
      </a>
      <div class="logo">POKÉBENA</div>
    </div>
  </header>

  <main>
    <div class="auth-card">

      <div class="pb-deco">
        <div class="pb-deco-top"></div>
        <div class="pb-deco-bot"></div>
        <div class="pb-deco-band"></div>
        <div class="pb-deco-btn"></div>
      </div>

      <div class="auth-title">POKÉBENA</div>
      <div class="auth-sub">Entre ou crie sua conta para salvar sua pontuação</div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login">Entrar</button>
        <button class="tab-btn" id="tab-register">Criar conta</button>
      </div>

      <!-- Login -->
      <form class="auth-form" id="form-login" autocomplete="on">
        <div class="field-group">
          <label class="field-label" for="login-email">E-mail</label>
          <input class="field-input" type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="login-pw">Senha</label>
          <input class="field-input" type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="msg" id="login-msg"></div>
        <button class="submit-btn" type="submit" id="login-btn">ENTRAR</button>
      </form>

      <!-- Cadastro -->
      <form class="auth-form hidden" id="form-register" autocomplete="on">
        <div class="field-group">
          <label class="field-label" for="reg-user">Nome de treinador</label>
          <input class="field-input" type="text" id="reg-user" placeholder="AshKetchum42" autocomplete="username" required maxlength="20">
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-email">E-mail</label>
          <input class="field-input" type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-pw">Senha</label>
          <input class="field-input" type="password" id="reg-pw" placeholder="mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
        </div>
        <div class="field-group">
          <label class="field-label" for="reg-pw2">Confirmar senha</label>
          <input class="field-input" type="password" id="reg-pw2" placeholder="••••••••" autocomplete="new-password" required>
        </div>
        <div class="msg" id="reg-msg"></div>
        <button class="submit-btn" type="submit" id="reg-btn">CRIAR CONTA</button>
      </form>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    // Se já logado, vai para index
    auth.onAuthStateChanged(function(user) {
      if (user) window.location.href = 'index.html';
    });

    // ── Tabs ─────────────────────────────────────
    var tabLogin = document.getElementById('tab-login');
    var tabReg   = document.getElementById('tab-register');
    var fLogin   = document.getElementById('form-login');
    var fReg     = document.getElementById('form-register');

    tabLogin.addEventListener('click', function() {
      tabLogin.classList.add('active'); tabReg.classList.remove('active');
      fLogin.classList.remove('hidden'); fReg.classList.add('hidden');
    });
    tabReg.addEventListener('click', function() {
      tabReg.classList.add('active'); tabLogin.classList.remove('active');
      fReg.classList.remove('hidden'); fLogin.classList.add('hidden');
    });

    // ── Login ────────────────────────────────────
    fLogin.addEventListener('submit', async function(e) {
      e.preventDefault();
      var msgEl = document.getElementById('login-msg');
      var btn   = document.getElementById('login-btn');
      var email = document.getElementById('login-email').value.trim();
      var pw    = document.getElementById('login-pw').value;

      msgEl.className = 'msg'; msgEl.textContent = '';
      btn.disabled = true; btn.textContent = 'Entrando...';

      try {
        await auth.signInWithEmailAndPassword(email, pw);
        window.location.href = 'index.html';
      } catch(err) {
        msgEl.className = 'msg error';
        msgEl.textContent = errMsg(err.code);
        btn.disabled = false; btn.textContent = 'ENTRAR';
      }
    });

    // ── Cadastro ─────────────────────────────────
    fReg.addEventListener('submit', async function(e) {
      e.preventDefault();
      var msgEl    = document.getElementById('reg-msg');
      var btn      = document.getElementById('reg-btn');
      var username = document.getElementById('reg-user').value.trim();
      var email    = document.getElementById('reg-email').value.trim();
      var pw       = document.getElementById('reg-pw').value;
      var pw2      = document.getElementById('reg-pw2').value;

      msgEl.className = 'msg'; msgEl.textContent = '';

      if (!username)    { msgEl.className='msg error'; msgEl.textContent='Escolha um nome de treinador.'; return; }
      if (pw !== pw2)   { msgEl.className='msg error'; msgEl.textContent='As senhas não coincidem.'; return; }

      btn.disabled = true; btn.textContent = 'Verificando...';

      /* Verifica unicidade do username */
      try {
        var usernameSnap = await db.collection('users').where('username','==', username).limit(1).get();
        if (!usernameSnap.empty) {
          msgEl.className = 'msg error';
          msgEl.textContent = 'Este nome de treinador já está em uso. Escolha outro.';
          btn.disabled = false; btn.textContent = 'CRIAR CONTA'; return;
        }
      } catch(e) {}

      btn.textContent = 'Criando conta...';

      try {
        var cred = await auth.createUserWithEmailAndPassword(email, pw);
        await cred.user.updateProfile({ displayName: username });
        await db.collection('users').doc(cred.user.uid).set({
          username:    username,
          email:       email,
          createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
          totalGames:  0,
          totalScore:  0,
          bestScore:   0,
        });
        window.location.href = 'index.html';
      } catch(err) {
        msgEl.className = 'msg error';
        msgEl.textContent = errMsg(err.code);
        btn.disabled = false; btn.textContent = 'CRIAR CONTA';
      }
    });

    function errMsg(code) {
      var msgs = {
        'auth/user-not-found':       'E-mail não encontrado.',
        'auth/wrong-password':       'Senha incorreta.',
        'auth/invalid-credential':   'E-mail ou senha incorretos.',
        'auth/email-already-in-use': 'Este e-mail já está em uso.',
        'auth/weak-password':        'Senha muito fraca (mínimo 6 caracteres).',
        'auth/invalid-email':        'E-mail inválido.',
        'auth/too-many-requests':    'Muitas tentativas. Aguarde e tente novamente.',
        'auth/network-request-failed': 'Sem conexão. Verifique sua internet.',
      };
      return msgs[code] || 'Ocorreu um erro. Tente novamente.';
    }
  </script>
</body>
</html>
