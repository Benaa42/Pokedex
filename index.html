<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POKÉDEX — POKEBENA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070f;
      --surface: #0e0e1c;
      --surface-2: #15152a;
      --text: #e2e2f0;
      --muted: #5a5a7a;
      --border: rgba(255,255,255,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(112,56,248,.18) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(248,88,136,.1) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(104,144,240,.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(7,7,15,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      letter-spacing: .12em;
      background: linear-gradient(130deg, #7038F8 0%, #F85888 50%, #F8D030 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logo em { font-style: normal; font-weight: 400; opacity: .55; }

    .search-wrap {
      flex: 1;
      min-width: 180px;
      max-width: 380px;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: .6rem 1rem .6rem 2.6rem;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .05em;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #search::placeholder { color: var(--muted); }

    #search:focus {
      border-color: rgba(112,56,248,.5);
      box-shadow: 0 0 0 3px rgba(112,56,248,.1);
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-left: auto;
    }

    .quiz-link {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: linear-gradient(130deg, rgba(248,208,48,.22) 0%, rgba(112,56,248,.18) 100%);
      border: 1px solid rgba(248,208,48,.5);
      color: #F8D030;
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: .55rem 1.3rem .55rem 1rem;
      border-radius: 50px;
      text-decoration: none;
      white-space: nowrap;
      transition: all .25s;
      position: relative;
      overflow: hidden;
      animation: quiz-glow 2.4s ease-in-out infinite;
    }

    @keyframes quiz-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(248,208,48,.25); }
      50%       { box-shadow: 0 0 22px rgba(248,208,48,.55), 0 0 40px rgba(248,208,48,.15); }
    }

    .quiz-link::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      animation: quiz-shimmer 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes quiz-shimmer {
      0%       { left: -100%; }
      55%, 100% { left: 170%; }
    }

    .quiz-link:hover {
      background: linear-gradient(130deg, rgba(248,208,48,.42) 0%, rgba(112,56,248,.32) 100%);
      border-color: rgba(248,208,48,.9);
      box-shadow: 0 0 30px rgba(248,208,48,.5), 0 0 60px rgba(248,208,48,.18);
      transform: scale(1.06);
      animation: none;
    }
    .quiz-link:hover::after { display: none; }

    .battle-link {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: linear-gradient(130deg, rgba(248,88,136,.16) 0%, rgba(112,56,248,.12) 100%);
      border: 1px solid rgba(248,88,136,.35);
      color: #F85888;
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: .55rem 1.3rem .55rem 1rem;
      border-radius: 50px;
      text-decoration: none;
      white-space: nowrap;
      transition: all .25s;
    }

    .battle-link:hover {
      background: linear-gradient(130deg, rgba(248,88,136,.35) 0%, rgba(112,56,248,.25) 100%);
      border-color: rgba(248,88,136,.75);
      box-shadow: 0 0 20px rgba(248,88,136,.3);
      transform: scale(1.04);
    }

    #random-btn {
      display: flex;
      align-items: center;
      gap: .45rem;
      background: linear-gradient(130deg, rgba(112,56,248,.2), rgba(248,88,136,.2));
      border: 1px solid rgba(112,56,248,.35);
      color: var(--text);
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .5rem 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }

    #random-btn:hover:not(:disabled) {
      background: linear-gradient(130deg, rgba(112,56,248,.35), rgba(248,88,136,.35));
      border-color: rgba(112,56,248,.6);
      box-shadow: 0 0 18px rgba(112,56,248,.25);
    }

    #random-btn:active:not(:disabled) {
      transform: scale(.96);
    }

    #random-btn:disabled { opacity: .35; cursor: not-allowed; }

    #random-btn svg { flex-shrink: 0; }

    #count-badge {
      font-family: 'Orbitron', monospace;
      font-size: .65rem;
      letter-spacing: .15em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── MAIN ───────────────────────────────────────── */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* Hero */
    .hero {
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: .95;
      letter-spacing: -.01em;
      margin-bottom: .75rem;
    }

    .hero h1 span {
      display: block;
      background: linear-gradient(130deg, #7038F8, #F85888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: .05em;
      max-width: 420px;
    }

    /* ── TYPE FILTERS ───────────────────────────────── */
    .filters-wrap {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .filters-label {
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .filters {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
    }

    .type-btn {
      padding: .3rem .85rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .18s;
    }

    .type-btn:hover { color: var(--text); }
    .type-btn.active { color: #fff; }

    /* ── GRID ───────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1rem;
    }

    /* ── POKEMON CARD ───────────────────────────────── */
    .poke-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem 1rem 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition:
        transform .28s cubic-bezier(.34,1.56,.64,1),
        box-shadow .28s ease,
        border-color .28s ease,
        opacity .3s ease;
    }

    .poke-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Type-colored radial glow on hover */
    .poke-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, var(--c, rgba(112,56,248,.12)) 0%, transparent 65%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }

    .poke-card:hover {
      transform: translateY(-7px) scale(1.025);
      border-color: var(--c-dim, rgba(112,56,248,.35));
      box-shadow: 0 22px 50px rgba(0,0,0,.45), 0 0 28px var(--c-glow, rgba(112,56,248,.14));
    }

    .poke-card:hover::after { opacity: 1; }

    /* Pokéball watermark */
    .poke-card::before {
      content: '';
      position: absolute;
      right: -20px;
      bottom: -20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 20px solid rgba(255,255,255,.025);
      pointer-events: none;
    }

    .poke-num {
      font-family: 'Orbitron', monospace;
      font-size: .68rem;
      letter-spacing: .18em;
      color: rgba(255,255,255,.52);
      align-self: flex-start;
      margin-bottom: .5rem;
      position: relative;
      z-index: 1;
    }

    .poke-img-wrap {
      width: 108px;
      height: 108px;
      position: relative;
      margin: 0 auto .8rem;
      z-index: 1;
    }

    .poke-img-halo {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--c, rgba(112,56,248,.2)) 0%, transparent 70%);
      opacity: .6;
      transition: opacity .3s, transform .3s;
    }

    .poke-card:hover .poke-img-halo {
      opacity: 1;
      transform: scale(1.15);
    }

    .poke-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 10px var(--c-glow, rgba(112,56,248,.25)));
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }

    .poke-card:hover .poke-img {
      transform: scale(1.12) translateY(-3px);
    }

    .poke-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: .5rem;
      position: relative;
      z-index: 1;
    }

    .types {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .type-tag {
      padding: .18rem .55rem;
      border-radius: 50px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── SKELETON ───────────────────────────────────── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    .skel {
      background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,.04) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── EMPTY STATE ────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      padding: 5rem 2rem;
      text-align: center;
      color: var(--muted);
    }

    .empty svg { margin-bottom: 1rem; opacity: .3; }

    .empty p {
      font-family: 'Orbitron', monospace;
      font-size: .8rem;
      letter-spacing: .15em;
    }

    /* ── LOAD MORE ──────────────────────────────────── */
    .load-wrap {
      margin-top: 2.5rem;
      text-align: center;
    }

    #load-more {
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
      color: var(--muted);
      font-family: 'Orbitron', monospace;
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: .85rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all .2s;
    }

    #load-more:hover:not(:disabled) {
      background: rgba(255,255,255,.04);
      border-color: rgba(255,255,255,.22);
      color: var(--text);
    }

    #load-more:disabled { opacity: .35; cursor: not-allowed; }

    /* ── MODAL ──────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      width: 100%;
      max-width: 816px;
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateY(24px) scale(.96);
      transition: transform .32s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }

    .overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    /* Modal top band */
    .modal-band {
      position: relative;
      padding: 2rem 2rem 2rem;
      overflow: hidden;
      min-height: 280px;
    }

    .modal-band-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 80% 30%, var(--mc, rgba(112,56,248,.25)) 0%, transparent 65%);
    }

    .modal-band-circle {
      position: absolute;
      right: -30px;
      top: -30px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.04);
    }

    .shiny-toggle {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-top: .85rem;
      background: rgba(250,204,21,.07);
      border: 1px solid rgba(250,204,21,.28);
      border-radius: 50px;
      padding: .4rem 1rem;
      color: rgba(250,204,21,.65);
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .12em;
      cursor: pointer;
      transition: all .22s;
      position: relative;
      z-index: 2;
    }

    .shiny-toggle:hover {
      background: rgba(250,204,21,.14);
      border-color: rgba(250,204,21,.5);
      color: #facc15;
      box-shadow: 0 0 14px rgba(250,204,21,.2);
    }

    .shiny-toggle .star { display: inline-block; transition: transform .3s; }
    .shiny-toggle:hover .star { animation: star-spin .5s ease; }

    @keyframes star-spin {
      0%   { transform: rotate(0) scale(1); }
      50%  { transform: rotate(180deg) scale(1.4); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .shiny-toggle.on {
      background: rgba(250,204,21,.18);
      border-color: rgba(250,204,21,.65);
      color: #facc15;
      box-shadow: 0 0 20px rgba(250,204,21,.3), 0 0 6px rgba(250,204,21,.2) inset;
      animation: shiny-pulse 2s infinite;
    }

    @keyframes shiny-pulse {
      0%, 100% { box-shadow: 0 0 14px rgba(250,204,21,.25), 0 0 4px rgba(250,204,21,.15) inset; }
      50%       { box-shadow: 0 0 28px rgba(250,204,21,.5), 0 0 8px rgba(250,204,21,.25) inset; }
    }

    /* Audio controls */
    .audio-ctrl {
      position: absolute;
      right: 1.5rem;
      top: 1.2rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: .5rem;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50px;
      padding: .3rem .6rem .3rem .3rem;
    }

    .cry-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .2s;
    }

    .cry-btn:hover {
      background: rgba(255,255,255,.13);
      color: var(--text);
    }

    .cry-btn.playing {
      color: var(--cry-color, #78C850);
      border-color: var(--cry-color, #78C850);
      box-shadow: 0 0 10px var(--cry-color, #78C850);
      animation: sound-wave 0.6s infinite alternate;
    }

    @keyframes sound-wave {
      from { transform: scale(1); }
      to   { transform: scale(1.1); }
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 3px;
      border-radius: 50px;
      background: rgba(255,255,255,.18);
      outline: none;
      cursor: pointer;
      transition: background .2s;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cry-color, #78C850);
      cursor: pointer;
      box-shadow: 0 0 6px var(--cry-color, #78C850);
      transition: transform .15s;
    }

    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .volume-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cry-color, #78C850);
      border: none;
      cursor: pointer;
    }

    /* Evolution chain */
    .evo-section {
      padding: 1.5rem 2rem 2rem;
      border-top: 1px solid var(--border);
    }

    .evo-section .modal-section-title { margin-bottom: 1.1rem; }

    .evo-chain {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .evo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .6rem .8rem;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      min-width: 72px;
    }

    .evo-card:hover {
      background: rgba(255,255,255,.05);
      border-color: var(--border);
      transform: translateY(-3px);
    }

    .evo-card.current {
      background: rgba(255,255,255,.06);
      border-color: var(--evo-c, rgba(255,255,255,.18));
      box-shadow: 0 0 12px var(--evo-glow, rgba(112,56,248,.15));
    }

    .evo-card img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }

    .evo-card .evo-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: capitalize;
      color: var(--text);
    }

    .evo-card .evo-num {
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      color: rgba(255,255,255,.48);
      letter-spacing: .12em;
    }

    .evo-arrow {
      color: var(--muted);
      font-size: 1rem;
      flex-shrink: 0;
      opacity: .5;
    }

    .evo-loading {
      color: var(--muted);
      font-family: 'Orbitron', monospace;
      font-size: .6rem;
      letter-spacing: .15em;
      text-align: center;
      padding: 1rem;
      animation: evo-blink 1.2s infinite;
    }

    @keyframes evo-blink {
      0%, 100% { opacity: .4; }
      50%       { opacity: 1; }
    }

    .modal-sprite {
      position: absolute;
      right: 1.5rem;
      bottom: -1rem;
      width: 248px;
      height: 248px;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px var(--mg, rgba(112,56,248,.45)));
      z-index: 2;
      transition: opacity .2s, filter .3s;
    }

    .modal-num {
      font-family: 'Orbitron', monospace;
      font-size: .65rem;
      letter-spacing: .22em;
      color: rgba(255,255,255,.4);
      margin-bottom: .4rem;
      position: relative;
      z-index: 2;
    }

    .modal-name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      line-height: 1;
      letter-spacing: .03em;
      text-transform: uppercase;
      margin-bottom: .9rem;
      position: relative;
      z-index: 2;
    }

    .modal-types {
      display: flex;
      gap: .4rem;
      position: relative;
      z-index: 2;
    }

    /* Modal body */
    .modal-body {
      padding: 2rem 2rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 520px) {
      .modal-body { grid-template-columns: 1fr; }
      .modal-sprite { width: 144px; height: 144px; right: 1rem; }
    }

    .modal-section-title {
      font-family: 'Orbitron', monospace;
      font-size: .58rem;
      letter-spacing: .22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: .9rem;
    }

    /* Stats */
    .stat-row {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin-bottom: .55rem;
    }

    .stat-name {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      width: 52px;
      flex-shrink: 0;
    }

    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: .75rem;
      font-weight: 700;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    .stat-track {
      flex: 1;
      height: 5px;
      background: var(--surface-2);
      border-radius: 50px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      border-radius: 50px;
      width: 0;
      transition: width 1s cubic-bezier(.25,1,.5,1);
    }

    .stat-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: .9rem;
      padding-top: .75rem;
      border-top: 1px solid var(--border);
    }

    .stat-total span:first-child {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat-total span:last-child {
      font-family: 'Orbitron', monospace;
      font-size: .9rem;
      font-weight: 700;
    }

    /* Info cards */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
    }

    .info-box {
      background: var(--surface-2);
      border-radius: 12px;
      padding: .75rem .85rem;
    }

    .info-box .label {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .2rem;
    }

    .info-box .value {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      text-transform: capitalize;
    }

    .info-box.full { grid-column: 1 / -1; }

    /* Close */
    .modal-close {
      position: absolute;
      top: 1.2rem;
      left: 1.2rem;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s;
    }

    .modal-close:hover { background: rgba(255,255,255,.12); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 50px; }

    /* ── AUTH HEADER ────────────────────────────────── */
    .auth-link {
      display: flex; align-items: center; gap: .35rem;
      color: var(--muted); text-decoration: none;
      font-family: 'Orbitron', monospace; font-size: .52rem;
      letter-spacing: .13em; text-transform: uppercase;
      border: 1px solid var(--border); padding: .4rem .9rem;
      border-radius: 50px; transition: all .18s; white-space: nowrap;
    }
    .auth-link:hover { border-color: rgba(248,208,48,.4); color: #F8D030; }
    .header-user { display: flex; align-items: center; gap: .45rem; }
    .header-username-link {
      display: flex; align-items: center; gap: .35rem; text-decoration: none;
      font-family: 'Orbitron', monospace; font-size: .52rem;
      letter-spacing: .12em; color: #F8D030;
      border: 1px solid rgba(248,208,48,.3); padding: .4rem .9rem;
      border-radius: 50px; transition: all .18s; white-space: nowrap; max-width: 130px;
    }
    .header-username-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-username-link:hover { border-color: rgba(248,208,48,.6); }
    .logout-header-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: 'Orbitron', monospace; font-size: .5rem; letter-spacing: .1em;
      padding: .4rem .7rem; border-radius: 50px; cursor: pointer; transition: all .18s;
    }
    .logout-header-btn:hover { border-color: rgba(248,80,80,.4); color: #f87171; }

    /* ── PAINEL DE NOTIFICAÇÕES ─────────────────────── */
    .notif-panel {
      max-width: 1200px; margin: 0 auto 1rem; padding: 0 1.5rem;
      position: relative; z-index: 2;
    }
    .notif-item {
      background: var(--surface);
      border: 1px solid rgba(248,88,136,.25);
      border-radius: 14px; padding: .75rem 1.1rem;
      display: flex; align-items: center; gap: .85rem;
      margin-bottom: .45rem; animation: notif-in .3s ease;
      cursor: pointer; transition: background .15s;
    }
    @keyframes notif-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .notif-item:hover { background: rgba(248,88,136,.06); }
    .notif-icon { font-size: 1.1rem; flex-shrink: 0; }
    .notif-text { flex: 1; font-size: .88rem; font-weight: 600; color: var(--text); }
    .notif-sub  { font-family: 'Orbitron', monospace; font-size: .42rem; letter-spacing: .13em; color: var(--muted); margin-top: .08rem; }
    .notif-action {
      background: linear-gradient(130deg,rgba(248,88,136,.22),rgba(112,56,248,.18));
      border: 1px solid rgba(248,88,136,.45); color: var(--p1);
      font-family: 'Orbitron', monospace; font-size: .48rem; letter-spacing: .13em;
      padding: .38rem .9rem; border-radius: 50px; cursor: pointer; transition: all .18s; flex-shrink: 0;
    }
    .notif-action:hover { border-color: rgba(248,88,136,.8); }
    .notif-dismiss { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; padding: .2rem .4rem; transition: color .15s; flex-shrink: 0; }
    .notif-dismiss:hover { color: #f87171; }

    /* ── MOBILE RESPONSIVO ─────────────────────────── */
    @media (max-width: 640px) {
      /* Header: busca vai para segunda linha */
      .header-inner { padding: .65rem 1rem; gap: .65rem; }
      .search-wrap { order: 3; flex: 1 0 100%; max-width: none; min-width: 0; }
      .header-meta { gap: .65rem; }
      #count-badge { display: none; }

      /* Main */
      main { padding: 1rem; }
      .hero { margin-bottom: 1.5rem; }
      .filters-wrap { margin-bottom: 1.25rem; }
      .type-btn { padding: .38rem .72rem; }

      /* Grid */
      #grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: .65rem; }
      .poke-card { padding: 1rem .8rem .85rem; border-radius: 14px; }
      .poke-img-wrap { width: 90px; height: 90px; }

      /* Modal como bottom sheet */
      .overlay { align-items: flex-end; padding: 0; }
      .modal {
        border-radius: 22px 22px 0 0;
        max-width: 100%;
        max-height: 93vh;
        transform: translateY(60px);
      }
      .overlay.open .modal { transform: translateY(0) scale(1); }
      .modal-band { min-height: 196px; padding: 1.4rem 1rem 1rem; }
      .modal-sprite { width: 155px; height: 155px; right: .75rem; }
      .audio-ctrl { right: 1rem; top: 1rem; }
      .modal-body { padding: 1.25rem 1rem; gap: 1.25rem; }
      .evo-section { padding: 1.25rem 1rem 1.75rem; }
      .evo-card img { width: 62px; height: 62px; }
      .load-wrap { margin-top: 1.75rem; }
    }

    @media (max-width: 520px) {
      .modal-body { grid-template-columns: 1fr; }
      .modal-sprite { width: 145px; height: 145px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">POKEBENA<em>DEX</em></div>
      <div class="search-wrap">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search" type="search" placeholder="Buscar nome ou nº...">
      </div>
      <div class="header-meta">
        <a href="quiz.html" class="quiz-link">
          ❓ Quiz
        </a>
        <a href="battle.html" class="battle-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
            <line x1="13" y1="19" x2="19" y2="13"/>
            <line x1="16" y1="16" x2="20" y2="20"/>
            <line x1="19" y1="21" x2="21" y2="19"/>
            <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
            <line x1="5" y1="14" x2="9" y2="18"/>
            <line x1="7" y1="21" x2="3" y2="21"/>
            <line x1="7" y1="21" x2="7" y2="18"/>
          </svg>
          ⚔ Arena
        </a>
        <button id="random-btn" title="Pokémon aleatório" disabled>
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h4l2 2h6l2-2h2v2l-2 2v2l2 2v2h-2l-2-2h-6l-2 2H4v-2l2-2V8L4 6V4z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 9l2 2-2 2M9 9L7 11l2 2"/>
          </svg>
          Aleatório
        </button>
        <span id="count-badge">Carregando...</span>

        <!-- Auth -->
        <a href="login.html" id="header-auth-login" class="auth-link" style="display:none">
          <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          Entrar
        </a>
        <div id="header-auth-user" class="header-user" style="display:none">
          <a href="perfil.html" class="header-username-link">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            <span id="header-auth-username">...</span>
          </a>
          <button class="logout-header-btn" id="header-logout-btn" title="Sair">↩</button>
        </div>

      </div>
    </div>
  </header>

  <!-- Painel de notificações (visível apenas quando logado) -->
  <div class="notif-panel" id="notif-panel" style="display:none"></div>

  <main>
    <div class="hero">
      <h1>POKE<span>DEX</span></h1>
      <p>Explore todos os Pokémon com dados em tempo real da PokéAPI.</p>
    </div>

    <div class="filters-wrap">
      <div class="filters-label">Filtrar por tipo</div>
      <div class="filters" id="filters">
        <button class="type-btn active" data-type="all">Todos</button>
      </div>
    </div>

    <div id="grid"></div>

    <div class="load-wrap">
      <button id="load-more" disabled>Carregar Gerações 3–9</button>
    </div>
  </main>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <div id="modal-inner"></div>
    </div>
  </div>

  <script>
  (() => {
    /* ── CONFIG ─────────────────────────────────────── */
    const TYPE_COLOR = {
      normal:'#A8A878', fire:'#F08030', water:'#6890F0', electric:'#F8D030',
      grass:'#78C850', ice:'#98D8D8', fighting:'#C03028', poison:'#A040A0',
      ground:'#E0C068', flying:'#A890F0', psychic:'#F85888', bug:'#A8B820',
      rock:'#B8A038', ghost:'#705898', dragon:'#7038F8', dark:'#705848',
      steel:'#B8B8D0', fairy:'#EE99AC'
    };

    const TYPE_PT = {
      normal:'Normal', fire:'Fogo', water:'Água', electric:'Elétrico',
      grass:'Planta', ice:'Gelo', fighting:'Lutador', poison:'Veneno',
      ground:'Terra', flying:'Voador', psychic:'Psíquico', bug:'Inseto',
      rock:'Pedra', ghost:'Fantasma', dragon:'Dragão', dark:'Sombrio',
      steel:'Aço', fairy:'Fada'
    };

    const STAT_SHORT = {
      hp:'HP', attack:'ATK', defense:'DEF',
      'special-attack':'SpA', 'special-defense':'SpD', speed:'VEL'
    };

    /* ── STATE ──────────────────────────────────────── */
    let all = [];
    let activeType = 'all';
    let query = '';
    let extLoaded = false;
    let loading = false;

    /* ── ELEMENTS ───────────────────────────────────── */
    const grid      = document.getElementById('grid');
    const searchEl  = document.getElementById('search');
    const filtersEl = document.getElementById('filters');
    const loadBtn   = document.getElementById('load-more');
    const randomBtn = document.getElementById('random-btn');
    const badge     = document.getElementById('count-badge');
    const overlay   = document.getElementById('overlay');
    const modalEl   = document.getElementById('modal');
    const modalInner= document.getElementById('modal-inner');
    const closeBtn  = document.getElementById('modal-close');

    /* ── HELPERS ────────────────────────────────────── */
    function hex(h, a) {
      const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function pad(n) { return String(n).padStart(4,'0'); }

    function sprite(data) {
      return data.sprites?.other?.['official-artwork']?.front_default
          || data.sprites?.front_default
          || '';
    }

    function spriteShiny(data) {
      return data.sprites?.other?.['official-artwork']?.front_shiny
          || data.sprites?.front_shiny
          || sprite(data);
    }

    function typeTag(name, color) {
      return `<span class="type-tag" style="background:${hex(color,.18)};color:${color};border:1px solid ${hex(color,.35)}">${TYPE_PT[name]||name}</span>`;
    }

    /* ── TYPE FILTERS BUILD ──────────────────────────── */
    Object.entries(TYPE_PT).forEach(([key, label]) => {
      const c = TYPE_COLOR[key];
      const btn = document.createElement('button');
      btn.className = 'type-btn';
      btn.dataset.type = key;
      btn.textContent = label;
      btn.addEventListener('click', () => setType(key));
      btn.addEventListener('mouseenter', () => { if (!btn.classList.contains('active')) styleBtn(btn, key); });
      btn.addEventListener('mouseleave', () => { if (!btn.classList.contains('active')) unstyleBtn(btn); });
      filtersEl.appendChild(btn);
    });

    function styleBtn(btn, type) {
      const c = TYPE_COLOR[type];
      if (!c) return;
      btn.style.borderColor = hex(c,.5);
      btn.style.color = c;
      btn.style.background = hex(c,.12);
    }

    function unstyleBtn(btn) {
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.style.background = '';
    }

    function setType(type) {
      activeType = type;
      document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('active');
        unstyleBtn(b);
      });
      const active = document.querySelector(`.type-btn[data-type="${type}"]`);
      active.classList.add('active');
      if (type !== 'all') styleBtn(active, type);
      else { active.style.borderColor='rgba(255,255,255,.2)'; active.style.color=getComputedStyle(document.documentElement).getPropertyValue('--text').trim(); }
      render();
    }

    /* ── INTERSECTION OBSERVER (card reveal) ─────────── */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: .08 });

    /* ── SKELETON ───────────────────────────────────── */
    function addSkeletons(n) {
      for (let i=0;i<n;i++) {
        const s = document.createElement('div');
        s.className = 'skeleton';
        s.innerHTML = `
          <div class="skel" style="width:52px;height:10px;border-radius:50px;align-self:flex-start"></div>
          <div class="skel" style="width:90px;height:90px;border-radius:50%"></div>
          <div class="skel" style="width:75%;height:14px"></div>
          <div style="display:flex;gap:.35rem">
            <div class="skel" style="width:48px;height:18px;border-radius:50px"></div>
            <div class="skel" style="width:48px;height:18px;border-radius:50px"></div>
          </div>`;
        grid.appendChild(s);
      }
    }

    /* ── RENDER ─────────────────────────────────────── */
    function filtered() {
      return all.filter(p => {
        const byType = activeType === 'all' || p.types.some(t => t.type.name === activeType);
        const q = query.trim().toLowerCase();
        const byQ = !q || p.name.toLowerCase().includes(q) || String(p.id).includes(q);
        return byType && byQ;
      });
    }

    function render() {
      grid.innerHTML = '';
      const list = filtered();
      badge.textContent = `${list.length} / ${all.length} POKÉMON`;

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>Nenhum Pokémon encontrado</p>
          </div>`;
        return;
      }

      list.forEach((p, i) => {
        const pType = p.types[0].type.name;
        const c = TYPE_COLOR[pType] || '#7038F8';
        const card = document.createElement('div');
        card.className = 'poke-card';
        card.style.setProperty('--c', hex(c,.18));
        card.style.setProperty('--c-dim', hex(c,.4));
        card.style.setProperty('--c-glow', hex(c,.2));

        const imgSrc = sprite(p);
        const tags = p.types.map(t => typeTag(t.type.name, TYPE_COLOR[t.type.name]||'#888')).join('');

        card.innerHTML = `
          <div class="poke-num">#${pad(p.id)}</div>
          <div class="poke-img-wrap">
            <div class="poke-img-halo"></div>
            <img class="poke-img" src="${imgSrc}" alt="${p.name}" loading="lazy"
                 onerror="this.style.opacity='.3'">
          </div>
          <div class="poke-name">${p.name}</div>
          <div class="types">${tags}</div>`;

        card.addEventListener('click', () => openModal(p));
        grid.appendChild(card);
        io.observe(card);
      });
    }

    /* ── FETCH ──────────────────────────────────────── */
    async function fetchAll(url) {
      const r = await fetch(url); return r.json();
    }

    async function fetchBatch(list) {
      return Promise.all(list.map(p => fetchAll(p.url)));
    }

    async function init() {
      addSkeletons(12);
      const data = await fetchAll('https://pokeapi.co/api/v2/pokemon?limit=251&offset=0');
      const batch = await fetchBatch(data.results);
      all = batch.sort((a,b) => a.id - b.id);
      grid.querySelectorAll('.skeleton').forEach(s => s.remove());
      render();
      loadBtn.disabled = false;
      randomBtn.disabled = false;
    }

    randomBtn.addEventListener('click', () => {
      const list = filtered();
      if (!list.length) return;
      const p = list[Math.floor(Math.random() * list.length)];
      randomBtn.style.transform = 'scale(.94) rotate(15deg)';
      setTimeout(() => { randomBtn.style.transform = ''; }, 200);
      openModal(p);
    });

    loadBtn.addEventListener('click', async () => {
      if (loading || extLoaded) return;
      loading = true;
      loadBtn.disabled = true;
      loadBtn.textContent = 'Carregando...';
      addSkeletons(8);
      const data = await fetchAll('https://pokeapi.co/api/v2/pokemon?limit=700&offset=251');
      const batch = await fetchBatch(data.results);
      all = [...all, ...batch].sort((a,b) => a.id - b.id);
      grid.querySelectorAll('.skeleton').forEach(s => s.remove());
      extLoaded = true;
      loading = false;
      loadBtn.textContent = 'Todos os Pokémon carregados';
      loadBtn.disabled = true;
      render();
    });

    searchEl.addEventListener('input', e => { query = e.target.value; render(); });

    /* ── MODAL ──────────────────────────────────────── */
    function openModal(p) {
      const pType = p.types[0].type.name;
      const c = TYPE_COLOR[pType] || '#7038F8';
      const normalSrc = sprite(p);
      const shinySrc  = spriteShiny(p);
      const tags = p.types.map(t => typeTag(t.type.name, TYPE_COLOR[t.type.name]||'#888')).join('');

      const statsHtml = p.stats.map(s => {
        const nm = STAT_SHORT[s.stat.name] || s.stat.name;
        const val = s.base_stat;
        const pct = Math.min(100, Math.round(val / 255 * 100));
        return `
          <div class="stat-row">
            <div class="stat-name">${nm}</div>
            <div class="stat-val">${val}</div>
            <div class="stat-track"><div class="stat-fill" data-pct="${pct}" style="background:${c}"></div></div>
          </div>`;
      }).join('');

      const total = p.stats.reduce((s,x)=>s+x.base_stat,0);
      const h = (p.height/10).toFixed(1);
      const w = (p.weight/10).toFixed(1);
      const ab = p.abilities.map(a=>a.ability.name.replace(/-/g,' ')).join(', ');
      const exp = p.base_experience ?? '—';

      const cryUrl = p.cries?.latest || `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${p.id}.ogg`;

      modalInner.innerHTML = `
        <div class="modal-band">
          <div class="modal-band-bg" style="--mc:${hex(c,.28)}"></div>
          <div class="modal-band-circle"></div>
          <div class="audio-ctrl" style="--cry-color:${c}">
            <button class="cry-btn" id="cry-btn" title="Ouvir grito">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path stroke-linecap="round" d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
              </svg>
            </button>
            <input class="volume-slider" id="volume-slider" type="range" min="0" max="100" value="60" title="Volume">
          </div>
          <img class="modal-sprite" id="modal-poke-img" src="${normalSrc}" alt="${p.name}" style="--mg:${hex(c,.45)}">
          <div class="modal-num">#${pad(p.id)}</div>
          <div class="modal-name">${p.name}</div>
          <div class="modal-types">${tags}</div>
          <button class="shiny-toggle" id="shiny-toggle">
            <span class="star">✦</span> Ver Shiny <span class="star">✦</span>
          </button>
        </div>
        <div class="modal-body">
          <div>
            <div class="modal-section-title">Estatísticas Base</div>
            ${statsHtml}
            <div class="stat-total">
              <span>Total</span><span>${total}</span>
            </div>
          </div>
          <div>
            <div class="modal-section-title">Informações</div>
            <div class="info-grid">
              <div class="info-box"><div class="label">Altura</div><div class="value">${h} m</div></div>
              <div class="info-box"><div class="label">Peso</div><div class="value">${w} kg</div></div>
              <div class="info-box"><div class="label">Exp. Base</div><div class="value">${exp}</div></div>
              <div class="info-box"><div class="label">Geração</div><div class="value">${gen(p.id)}</div></div>
              <div class="info-box full"><div class="label">Habilidades</div><div class="value">${ab}</div></div>
            </div>
          </div>
        </div>
        <div class="evo-section">
          <div class="modal-section-title">Cadeia de Evolução</div>
          <div class="evo-chain" id="evo-chain">
            <div class="evo-loading">Carregando evoluções...</div>
          </div>
        </div>`;

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Animate bars
      setTimeout(() => {
        modalInner.querySelectorAll('.stat-fill').forEach(b => { b.style.width = b.dataset.pct + '%'; });
      }, 80);

      // Shiny toggle
      let isShiny = false;
      document.getElementById('shiny-toggle').addEventListener('click', () => {
        isShiny = !isShiny;
        const img = document.getElementById('modal-poke-img');
        const btn = document.getElementById('shiny-toggle');
        img.style.opacity = '0';
        setTimeout(() => {
          img.src = isShiny ? shinySrc : normalSrc;
          img.style.opacity = '1';
        }, 150);
        btn.classList.toggle('on', isShiny);
        btn.innerHTML = isShiny
          ? `<span class="star">✦</span> Ver Normal <span class="star">✦</span>`
          : `<span class="star">✦</span> Ver Shiny <span class="star">✦</span>`;
      });

      // Cry audio
      let audio = null;
      const volSlider = document.getElementById('volume-slider');

      document.getElementById('cry-btn').addEventListener('click', () => {
        const btn = document.getElementById('cry-btn');
        if (audio && !audio.paused) { audio.pause(); audio.currentTime = 0; btn.classList.remove('playing'); return; }
        audio = new Audio(cryUrl);
        audio.volume = volSlider.value / 100;
        btn.classList.add('playing');
        audio.play().catch(() => btn.classList.remove('playing'));
        audio.addEventListener('ended', () => btn.classList.remove('playing'));
      });

      volSlider.addEventListener('input', () => {
        if (audio) audio.volume = volSlider.value / 100;
      });

      // Evolution chain (async)
      loadEvoChain(p);
    }

    async function loadEvoChain(p) {
      try {
        const speciesUrl = p.species?.url || `https://pokeapi.co/api/v2/pokemon-species/${p.id}/`;
        const species = await fetch(speciesUrl).then(r => r.json());
        const evoData = await fetch(species.evolution_chain.url).then(r => r.json());

        // Flatten chain (handles branching like Eevee)
        const stages = [];
        function parseChain(node, depth) {
          const id = parseInt(node.species.url.split('/').filter(Boolean).pop());
          stages.push({ name: node.species.name, id, depth });
          node.evolves_to.forEach(n => parseChain(n, depth + 1));
        }
        parseChain(evoData.chain, 0);

        const container = document.getElementById('evo-chain');
        if (!container) return;

        if (stages.length <= 1) {
          container.innerHTML = `<div class="evo-loading" style="opacity:.5">Este Pokémon não evolui.</div>`;
          return;
        }

        // Group by depth for display
        const byDepth = {};
        stages.forEach(s => { (byDepth[s.depth] = byDepth[s.depth] || []).push(s); });
        const depths = Object.keys(byDepth).map(Number).sort((a,b)=>a-b);

        let html = '';
        depths.forEach((d, di) => {
          if (di > 0) html += `<div class="evo-arrow">→</div>`;
          byDepth[d].forEach(s => {
            const isCurrent = s.id === p.id;
            const typeColor = TYPE_COLOR[p.types[0].type.name] || '#7038F8';
            html += `
              <div class="evo-card${isCurrent ? ' current' : ''}"
                   data-id="${s.id}"
                   style="${isCurrent ? `--evo-c:${hex(typeColor,.4)};--evo-glow:${hex(typeColor,.2)}` : ''}">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${s.id}.png"
                     alt="${s.name}" loading="lazy">
                <div class="evo-name">${s.name}</div>
                <div class="evo-num">#${pad(s.id)}</div>
              </div>`;
          });
        });

        container.innerHTML = html;

        // Click to open that Pokémon
        container.querySelectorAll('.evo-card:not(.current)').forEach(card => {
          card.addEventListener('click', async () => {
            const id = card.dataset.id;
            card.style.opacity = '.5';
            const data = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}/`).then(r => r.json());
            openModal(data);
          });
        });
      } catch {
        const container = document.getElementById('evo-chain');
        if (container) container.innerHTML = `<div class="evo-loading" style="opacity:.4">Não foi possível carregar.</div>`;
      }
    }

    function gen(id) {
      if (id<=151) return 'I (Kanto)';
      if (id<=251) return 'II (Johto)';
      if (id<=386) return 'III (Hoenn)';
      if (id<=493) return 'IV (Sinnoh)';
      if (id<=649) return 'V (Unova)';
      if (id<=721) return 'VI (Kalos)';
      if (id<=809) return 'VII (Alola)';
      if (id<=905) return 'VIII (Galar)';
      return 'IX (Paldea)';
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    init();
  })();
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth-header.js"></script>
  <script>
  // ── NOTIFICAÇÕES NA INDEX ─────────────────────────
  var sfxAccepter = new Audio('BGM/accepter2.mp3');
  sfxAccepter.volume = 0.7;
  var notifUnsubIdx = null;
  var shownNotifs   = new Set();

  auth.onAuthStateChanged(function(user) {
    var panel = document.getElementById('notif-panel');
    if (!panel) return;
    if (!user) { panel.style.display = 'none'; if (notifUnsubIdx) notifUnsubIdx(); return; }

    panel.style.display = '';

    notifUnsubIdx = db.collection('users').doc(user.uid)
      .collection('notifications')
      .where('read', '==', false)
      .onSnapshot(function(snap) {
        panel.innerHTML = '';
        snap.forEach(function(doc) {
          var n = doc.data();
          var isNew = !shownNotifs.has(doc.id);
          if (isNew) { shownNotifs.add(doc.id); sfxAccepter.currentTime = 0; sfxAccepter.play().catch(function(){}); }

          var item = document.createElement('div');
          item.className = 'notif-item';

          var icon   = n.type === 'challenge' ? '⚔' : '🔔';
          var title  = n.type === 'challenge' ? n.from.username + ' te desafiou!' : (n.title || 'Nova notificação');
          var lvLbl  = n.level ? { 1:'Normal', 2:'Difícil', 3:'Extremo' }[n.level] || '' : '';
          var sub    = n.type === 'challenge' ? 'Desafio · ' + lvLbl + ' · 1 minuto' : '';

          item.innerHTML =
            '<div class="notif-icon">' + icon + '</div>' +
            '<div class="notif-text">' + title +
              (sub ? '<div class="notif-sub">' + sub + '</div>' : '') +
            '</div>' +
            (n.type === 'challenge' ? '<button class="notif-action" data-cid="' + n.challengeId + '" data-level="' + (n.level||1) + '">Responder</button>' : '') +
            '<button class="notif-dismiss" data-id="' + doc.id + '" title="Dispensar">×</button>';

          item.querySelector('.notif-dismiss').addEventListener('click', function(e) {
            e.stopPropagation();
            db.collection('users').doc(user.uid).collection('notifications').doc(this.dataset.id).update({ read: true }).catch(function(){});
          });

          var respBtn = item.querySelector('.notif-action');
          if (respBtn) {
            respBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              window.location.href = 'quiz.html#desafio-' + this.dataset.cid + '-' + this.dataset.level;
            });
          }

          panel.appendChild(item);
        });
      });
  });
  </script>
</body>
