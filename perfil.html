<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POKÉBENA — Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070f; --surface: #0e0e1c; --surface-2: #15152a;
      --text: #e2e2f0; --muted: #5a5a7a; --border: rgba(255,255,255,0.06);
      --p1: #F85888; --p2: #6890F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 50% -10%, rgba(248,208,48,.1) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(248,88,136,.09) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(112,56,248,.07) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ─────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(7,7,15,.88); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 860px; margin: 0 auto; padding: .9rem 2rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .back-link {
      display: flex; align-items: center; gap: .4rem; color: var(--muted);
      text-decoration: none; font-family: 'Orbitron', monospace; font-size: .6rem;
      letter-spacing: .15em; text-transform: uppercase; transition: color .2s;
    }
    .back-link:hover { color: var(--text); }
    .logo {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: clamp(.85rem, 2vw, 1.2rem); letter-spacing: .1em;
      background: linear-gradient(130deg, #F8D030, #F85888);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── MAIN ───────────────────────────────────── */
    main { max-width: 860px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }

    /* Loading */
    #loading {
      padding: 5rem; text-align: center;
      font-family: 'Orbitron', monospace; font-size: .58rem;
      letter-spacing: .22em; color: var(--muted);
    }

    /* ── PROFILE HEADER ─────────────────────────── */
    .profile-hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; padding: 1.75rem 2rem;
      display: flex; align-items: center; gap: 1.5rem;
      margin-bottom: 1.1rem;
    }
    .avatar {
      width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 2rem;
      background: linear-gradient(135deg, rgba(248,208,48,.22), rgba(248,88,136,.18));
      border: 2px solid rgba(248,208,48,.3); color: #F8D030; text-transform: uppercase;
      box-shadow: 0 0 24px rgba(248,208,48,.14);
    }
    .prof-info { flex: 1; min-width: 0; }
    .prof-username {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: clamp(1rem, 3vw, 1.5rem); letter-spacing: .08em;
      color: var(--text); margin-bottom: .2rem;
    }
    .prof-email { font-size: .85rem; color: var(--muted); font-weight: 500; margin-bottom: .4rem; }
    .prof-since {
      font-family: 'Orbitron', monospace; font-size: .44rem;
      letter-spacing: .14em; color: var(--muted);
    }
    #logout-btn {
      background: transparent; border: 1px solid rgba(248,80,80,.28);
      color: rgba(248,80,80,.55); font-family: 'Orbitron', monospace;
      font-size: .47rem; letter-spacing: .14em; text-transform: uppercase;
      padding: .48rem 1rem; border-radius: 50px; cursor: pointer;
      transition: all .18s; flex-shrink: 0;
    }
    #logout-btn:hover { border-color: #f87171; color: #f87171; }

    /* ── STATS ──────────────────────────────────── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .65rem; margin-bottom: 1.1rem;
    }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: .9rem .7rem; text-align: center;
    }
    .stat-lbl {
      font-family: 'Orbitron', monospace; font-size: .44rem;
      letter-spacing: .16em; color: var(--muted); margin-bottom: .3rem;
      text-transform: uppercase;
    }
    .stat-val {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.3rem; line-height: 1;
    }
    #sv-games  { color: #F8D030; }
    #sv-total  { color: #a855f7; }
    #sv-best   { color: #4ade80; }
    #sv-avg    { color: #F85888; }

    /* ── HISTORY ────────────────────────────────── */
    .section-label {
      font-family: 'Orbitron', monospace; font-size: .5rem;
      letter-spacing: .22em; color: var(--muted); margin-bottom: .85rem;
    }
    .history-list {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
    }
    .hist-item {
      display: flex; align-items: center; gap: 1rem;
      padding: .88rem 1.25rem; border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .hist-item:last-child { border-bottom: none; }
    .hist-item:hover { background: rgba(255,255,255,.02); }

    .hist-score {
      font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: 1rem; color: #F8D030; flex-shrink: 0; min-width: 42px; text-align: right;
    }
    .hist-score.perfect { color: #4ade80; }
    .hist-score.low     { color: #f87171; }

    .hist-info { flex: 1; min-width: 0; }
    .hist-pokemon {
      font-size: .9rem; font-weight: 700; color: var(--text);
      text-transform: capitalize; letter-spacing: .04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hist-date {
      font-family: 'Orbitron', monospace; font-size: .42rem;
      letter-spacing: .14em; color: var(--muted); margin-top: .1rem;
    }

    .hist-lv {
      font-family: 'Orbitron', monospace; font-size: .44rem;
      letter-spacing: .12em; padding: .22rem .55rem; border-radius: 50px; flex-shrink: 0;
    }
    .hist-lv.lv1 { background: rgba(74,222,128,.12);  color: #4ade80; }
    .hist-lv.lv2 { background: rgba(248,208,48,.12);  color: #F8D030; }
    .hist-lv.lv3 { background: rgba(248,88,136,.12);  color: #F85888; }

    .hist-empty {
      padding: 3rem 1rem; text-align: center;
      font-family: 'Orbitron', monospace; font-size: .5rem;
      letter-spacing: .18em; color: var(--muted);
    }

    /* Challenge history */
    .ch-item {
      display: flex; align-items: center; gap: .85rem;
      padding: .88rem 1.25rem; border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .ch-item:last-child { border-bottom: none; }
    .ch-item:hover { background: rgba(255,255,255,.02); }
    .ch-result {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: .55rem;
      letter-spacing: .12em; padding: .22rem .55rem; border-radius: 50px; flex-shrink: 0;
    }
    .ch-result.win  { background: rgba(74,222,128,.15); color: #4ade80; }
    .ch-result.lose { background: rgba(248,80,80,.12);  color: #f87171; }
    .ch-result.draw { background: rgba(248,208,48,.12); color: #F8D030; }
    .ch-result.pend { background: rgba(104,144,240,.12); color: #6890F0; }
    .ch-info { flex: 1; min-width: 0; }
    .ch-opp  { font-size: .9rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-meta { font-family: 'Orbitron', monospace; font-size: .42rem; letter-spacing: .14em; color: var(--muted); margin-top: .08rem; }
    .ch-scores { font-family: 'Orbitron', monospace; font-weight: 900; font-size: .88rem; color: #F8D030; flex-shrink: 0; text-align: right; }

    /* ── ABAS DO PERFIL ─────────────────────────── */
    .profile-tabs { display: flex; gap: .38rem; background: var(--surface-2); border-radius: 50px; padding: .28rem; margin-bottom: 1.25rem; }
    .profile-tab { flex: 1; background: transparent; border: none; color: var(--muted); font-family: 'Orbitron', monospace; font-size: .48rem; letter-spacing: .12em; text-transform: uppercase; padding: .58rem .4rem; border-radius: 50px; cursor: pointer; transition: all .2s; }
    .profile-tab:not(.active):hover { color: var(--text); }
    .profile-tab.active { background: linear-gradient(130deg, rgba(248,208,48,.2), rgba(248,88,136,.15)); color: #F8D030; box-shadow: 0 0 12px rgba(248,208,48,.12); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── DESAFIOS ATIVOS ─────────────────────────── */
    .active-ch-item {
      display: flex; align-items: center; gap: .85rem;
      padding: .88rem 1.25rem; border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .active-ch-item:last-child { border-bottom: none; }
    .active-ch-item:hover { background: rgba(255,255,255,.02); }
    .ach-turn {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: .5rem;
      letter-spacing: .1em; padding: .22rem .55rem; border-radius: 50px; flex-shrink: 0; white-space: nowrap;
    }
    .ach-turn.mine  { background: rgba(74,222,128,.15); color: #4ade80; }
    .ach-turn.theirs { background: rgba(104,144,240,.12); color: #6890F0; }
    .ach-info { flex: 1; min-width: 0; }
    .ach-opp  { font-size: .9rem; font-weight: 700; color: var(--text); }
    .ach-meta { font-family: 'Orbitron', monospace; font-size: .42rem; letter-spacing: .12em; color: var(--muted); margin-top: .08rem; }
    .ach-actions { display: flex; gap: .45rem; flex-shrink: 0; }
    .ach-play-btn {
      background: linear-gradient(130deg,rgba(74,222,128,.2),rgba(112,56,248,.15));
      border: 1px solid rgba(74,222,128,.4); color: #4ade80;
      font-family: 'Orbitron', monospace; font-size: .48rem; letter-spacing: .13em;
      padding: .4rem .9rem; border-radius: 50px; cursor: pointer; transition: all .18s;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .ach-play-btn:hover { border-color: rgba(74,222,128,.7); box-shadow: 0 0 14px rgba(74,222,128,.18); }
    .ach-cancel-btn {
      background: transparent; border: 1px solid rgba(248,80,80,.28); color: rgba(248,80,80,.6);
      font-family: 'Orbitron', monospace; font-size: .48rem; letter-spacing: .1em;
      padding: .4rem .8rem; border-radius: 50px; cursor: pointer; transition: all .18s;
    }
    .ach-cancel-btn:hover { border-color: #f87171; color: #f87171; }

    /* ── MOBILE ─────────────────────────────────── */
    @media (max-width: 640px) {
      main { padding: 1rem; }
      .profile-hero { flex-wrap: wrap; }
      #logout-btn { order: 3; width: 100%; text-align: center; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 50px; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="back-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Pokédex
      </a>
      <div class="logo">PERFIL</div>
    </div>
  </header>

  <main>
    <div id="loading">Carregando perfil...</div>

    <div id="profile-content" style="display:none">

      <div class="profile-hero">
        <div class="avatar" id="av-letter">?</div>
        <div class="prof-info">
          <div class="prof-username" id="prof-username">—</div>
          <div class="prof-email"    id="prof-email">—</div>
          <div class="prof-since"    id="prof-since"></div>
        </div>
        <button id="logout-btn">↩ Sair</button>
      </div>

      <!-- Abas -->
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="resumo">📊 Resumo</button>
        <button class="profile-tab" data-tab="desafios-ativos">⚔ Desafios Ativos</button>
        <button class="profile-tab" data-tab="historico">📋 Histórico</button>
      </div>

      <!-- Aba: Resumo -->
      <div class="tab-panel active" id="tab-resumo">
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-lbl">Partidas</div><div class="stat-val" id="sv-games">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Total pts</div><div class="stat-val" id="sv-total">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Recorde</div><div class="stat-val" id="sv-best">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Média</div><div class="stat-val" id="sv-avg">0</div></div>
        </div>

        <div class="section-label" style="margin-top:.85rem">Desafios</div>
        <div class="stats-grid" id="challenge-stats-grid" style="display:none">
          <div class="stat-box"><div class="stat-lbl">Vitórias</div><div class="stat-val" id="sv-wins" style="color:#4ade80">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Derrotas</div><div class="stat-val" id="sv-losses" style="color:#f87171">0</div></div>
          <div class="stat-box"><div class="stat-lbl">Empates</div><div class="stat-val" id="sv-draws" style="color:#F8D030">0</div></div>
        </div>
        <div id="challenge-stats-empty" class="hist-empty" style="padding:1rem">Nenhum desafio disputado ainda</div>
      </div>

      <!-- Aba: Desafios Ativos -->
      <div class="tab-panel" id="tab-desafios-ativos">
        <div class="history-list" id="active-challenges-list">
          <div class="hist-empty">Nenhum desafio ativo</div>
        </div>
      </div>

      <!-- Aba: Histórico -->
      <div class="tab-panel" id="tab-historico">
        <div class="section-label">Histórico de desafios</div>
        <div class="history-list" id="challenge-history-list">
          <div class="hist-empty">Nenhum desafio registrado ainda</div>
        </div>

        <div class="section-label" style="margin-top:1rem">Partidas do quiz clássico</div>
        <div class="history-list" id="history-list">
          <div class="hist-empty">Nenhuma partida registrada ainda</div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    auth.onAuthStateChanged(async function(user) {
      if (!user) { window.location.href = 'login.html'; return; }

      document.getElementById('loading').style.display         = 'none';
      document.getElementById('profile-content').style.display = 'block';

      // Dados do usuário
      var doc  = await db.collection('users').doc(user.uid).get();
      var data = doc.exists ? doc.data() : {};
      var username = data.username || user.displayName || user.email.split('@')[0];
      // Sincroniza displayName se estiver desatualizado
      if (data.username && user.displayName !== data.username) {
        user.updateProfile({ displayName: data.username }).catch(function(){});
      }

      document.getElementById('av-letter').textContent    = username[0].toUpperCase();
      document.getElementById('prof-username').textContent = username;
      document.getElementById('prof-email').textContent    = user.email;

      if (data.createdAt) {
        var d = data.createdAt.toDate();
        document.getElementById('prof-since').textContent =
          'Treinador desde ' + d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      }

      // Estatísticas
      var totalGames = data.totalGames || 0;
      var totalScore = data.totalScore || 0;
      var bestScore  = data.bestScore  || 0;
      var avg = totalGames > 0 ? Math.round(totalScore / totalGames) : 0;

      document.getElementById('sv-games').textContent = totalGames;
      document.getElementById('sv-total').textContent = totalScore;
      document.getElementById('sv-best').textContent  = bestScore;
      document.getElementById('sv-avg').textContent   = avg;

      // Histórico
      var snap = await db.collection('users').doc(user.uid)
        .collection('gameHistory')
        .orderBy('date', 'desc')
        .limit(20)
        .get();

      if (!snap.empty) {
        var listEl = document.getElementById('history-list');
        listEl.innerHTML = '';
        snap.forEach(function(d) {
          var g = d.data();
          var score = g.score || 0;
          var sClass = score === 100 ? 'perfect' : score < 40 ? 'low' : '';
          var date   = g.date ? g.date.toDate().toLocaleDateString('pt-BR') : '—';
          var lv     = g.level || 1;
          var item   = document.createElement('div');
          item.className = 'hist-item';
          item.innerHTML =
            '<div class="hist-score ' + sClass + '">' + score + '</div>' +
            '<div class="hist-info">' +
              '<div class="hist-pokemon">' + (g.pokemon || '?').replace(/-/g, ' ') + '</div>' +
              '<div class="hist-date">' + date + '</div>' +
            '</div>' +
            '<div class="hist-lv lv' + lv + '">NV ' + lv + '</div>';
          listEl.appendChild(item);
        });
      }

      // Stats de Desafios
      var rankDoc = await db.collection('challengeRankings').doc(user.uid).get().catch(function(){return null;});
      if (rankDoc && rankDoc.exists) {
        var r = rankDoc.data();
        var wins   = r.wins   || 0;
        var losses = r.losses || 0;
        var draws  = r.draws  || 0;
        if (wins + losses + draws > 0) {
          document.getElementById('challenge-stats-empty').style.display = 'none';
          document.getElementById('challenge-stats-grid').style.display  = '';
          document.getElementById('sv-wins').textContent   = wins;
          document.getElementById('sv-losses').textContent = losses;
          document.getElementById('sv-draws').textContent  = draws;
        }
      }

      // Histórico de Desafios (sem orderBy para evitar índice composto)
      var lvLabels = { 1:'Normal', 2:'Difícil', 3:'Extremo' };
      var chListEl = document.getElementById('challenge-history-list');
      try {
        var [snapChall, snapOpp] = await Promise.all([
          db.collection('challenges').where('challenger.uid','==',user.uid).limit(20).get().catch(function(){return null;}),
          db.collection('challenges').where('opponent.uid','==',user.uid).limit(20).get().catch(function(){return null;}),
        ]);
        var chDocs = {};
        if (snapChall) snapChall.forEach(function(d){ chDocs[d.id] = d; });
        if (snapOpp)   snapOpp.forEach(function(d){   chDocs[d.id] = d; });
        // Ordena client-side por data (desc)
        var allCh = Object.values(chDocs).sort(function(a,b){
          var ta = a.data().createdAt ? a.data().createdAt.seconds : 0;
          var tb = b.data().createdAt ? b.data().createdAt.seconds : 0;
          return tb - ta;
        }).slice(0, 15);
        if (allCh.length > 0) {
          chListEl.innerHTML = '';
          allCh.forEach(function(doc) {
            var ch = doc.data();
            var isChallenger = ch.challenger.uid === user.uid;
            var opp      = isChallenger ? ch.opponent.username : ch.challenger.username;
            // Usa totais do novo sistema ou pontuações antigas como fallback
            var myScore  = ch.status === 'complete'
              ? (isChallenger ? (ch.total_challenger ?? ch.round1Score ?? '—') : (ch.total_opponent ?? ch.round2Score ?? '—'))
              : '—';
            var oppScore = ch.status === 'complete'
              ? (isChallenger ? (ch.total_opponent ?? ch.round2Score ?? '—') : (ch.total_challenger ?? ch.round1Score ?? '—'))
              : '—';
            var resultCls = 'pend', resultLbl = 'Em andamento';
            if (ch.status === 'complete') {
              if (ch.winner === user.uid)   { resultCls = 'win';  resultLbl = 'Vitória'; }
              else if (ch.winner === 'draw'){ resultCls = 'draw'; resultLbl = 'Empate';  }
              else                           { resultCls = 'lose'; resultLbl = 'Derrota'; }
            }
            var date = ch.createdAt ? ch.createdAt.toDate().toLocaleDateString('pt-BR') : '—';
            var item = document.createElement('div');
            item.className = 'ch-item';
            item.innerHTML =
              '<div class="ch-result ' + resultCls + '">' + resultLbl + '</div>' +
              '<div class="ch-info"><div class="ch-opp">vs ' + opp + '</div>' +
              '<div class="ch-meta">' + (lvLabels[ch.level]||'') + ' · ' + date + '</div></div>' +
              '<div class="ch-scores">' + myScore + ' × ' + oppScore + '</div>';
            chListEl.appendChild(item);
          });
        }
      } catch(e) {}

      // Desafios Ativos
      await loadActiveChallenges(user.uid, lvLabels);

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async function() {
        await auth.signOut();
        window.location.href = 'index.html';
      });

      // Tabs
      document.querySelectorAll('.profile-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.profile-tab').forEach(function(b){ b.classList.remove('active'); });
          document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
          btn.classList.add('active');
          var panel = document.getElementById('tab-' + btn.dataset.tab);
          if (panel) panel.classList.add('active');
        });
      });
    });

    async function loadActiveChallenges(uid, lvLabels) {
      var list = document.getElementById('active-challenges-list');
      var activeStatuses = ['challenger_r1','opponent_r1','challenger_r2','opponent_r2'];

      try {
        var [snapChall, snapOpp] = await Promise.all([
          db.collection('challenges').where('challenger.uid','==',uid).get().catch(function(){return null;}),
          db.collection('challenges').where('opponent.uid','==',uid).get().catch(function(){return null;}),
        ]);

        var active = {};
        if (snapChall) snapChall.forEach(function(d){
          if (activeStatuses.indexOf(d.data().status) >= 0) active[d.id] = d;
        });
        if (snapOpp) snapOpp.forEach(function(d){
          if (activeStatuses.indexOf(d.data().status) >= 0) active[d.id] = d;
        });

        var docs = Object.values(active).sort(function(a, b) {
          return (b.data().createdAt?.seconds||0) - (a.data().createdAt?.seconds||0);
        });

        if (!docs.length) { list.innerHTML = '<div class="hist-empty">Nenhum desafio ativo</div>'; return; }

        list.innerHTML = '';
        var statusLabel = {
          challenger_r1: 'Sua vez — R1', opponent_r1: 'Aguardando R1',
          challenger_r2: 'Sua vez — R2', opponent_r2: 'Aguardando R2',
        };
        var myTurn = { challenger_r1: true, challenger_r2: true, opponent_r1: false, opponent_r2: false };

        docs.forEach(function(doc) {
          var ch = doc.data();
          var isChallenger = ch.challenger.uid === uid;
          var opp = isChallenger ? ch.opponent.username : ch.challenger.username;

          // Determina se é a vez deste usuário
          var statusKey = ch.status;
          var iMyTurn = isChallenger ? myTurn[statusKey] : !myTurn[statusKey];
          var turnText = iMyTurn ? statusLabel[statusKey] : statusLabel[statusKey];
          var turnClass = iMyTurn ? 'mine' : 'theirs';

          var lv = lvLabels[ch.level] || '';
          var date = ch.createdAt ? ch.createdAt.toDate().toLocaleDateString('pt-BR') : '—';

          var item = document.createElement('div');
          item.className = 'active-ch-item';
          item.innerHTML =
            '<div class="ach-turn ' + turnClass + '">' + (statusLabel[statusKey] || ch.status) + '</div>' +
            '<div class="ach-info">' +
              '<div class="ach-opp">vs ' + opp + '</div>' +
              '<div class="ach-meta">' + lv + ' · ' + date + '</div>' +
            '</div>' +
            '<div class="ach-actions">' +
              (iMyTurn ? '<a class="ach-play-btn" href="quiz.html#desafio-' + doc.id + '">▶ Jogar</a>' : '') +
              '<button class="ach-cancel-btn" data-id="' + doc.id + '">Cancelar</button>' +
            '</div>';

          list.appendChild(item);
        });

        // Listeners dos botões de cancelar
        list.querySelectorAll('.ach-cancel-btn').forEach(function(btn) {
          btn.addEventListener('click', async function() {
            if (!confirm('Cancelar este desafio?')) return;
            var id = btn.dataset.id;
            btn.disabled = true; btn.textContent = '...';
            await db.collection('challenges').doc(id).update({ status: 'cancelled' }).catch(function(){});
            btn.closest('.active-ch-item').remove();
            if (!list.querySelector('.active-ch-item')) {
              list.innerHTML = '<div class="hist-empty">Nenhum desafio ativo</div>';
            }
          });
        });
      } catch(e) {
        list.innerHTML = '<div class="hist-empty">Erro ao carregar desafios</div>';
      }
    }
  </script>
</body>
</html>
